<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Portfolio | 민화·도예 작가 유미정</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@400;700;800&family=Nanum+Gothic:wght@400;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<script src="js/data.js"></script>
<script src="js/nav.js"></script>
<script>
tailwind.config = {
    theme: { extend: {
        colors: { 'hw-red':'#8B1A1A','hw-bg':'#F8F4ED','hw-bg2':'#EFE9DB','hw-text':'#2C2826','hw-muted':'#7A6B5A','hw-border':'#D4C9B5','hw-black':'#1A1714' },
        fontFamily: { heading:['Nanum Myeongjo','Georgia','serif'], body:['Nanum Gothic','Apple SD Gothic Neo','sans-serif'] }
    }}
}
</script>
<style>
:root{--p:#8B1A1A;--bg:#F8F4ED;--bg2:#EFE9DB;--txt:#2C2826;--mut:#7A6B5A;--bdr:#D4C9B5;--shd:0 4px 20px rgba(44,40,38,.08)}
body{font-family:'Nanum Gothic','Apple SD Gothic Neo',sans-serif;background:var(--bg);color:var(--txt)}
h1,h2,h3,h4{font-family:'Nanum Myeongjo',Georgia,serif}
.nav-link{position:relative;transition:color .25s}
.nav-link::after{content:'';position:absolute;bottom:-3px;left:0;width:0;height:1px;background:var(--p);transition:width .25s}
.nav-link:hover::after{width:100%}
.nav-link:hover{color:var(--p)}
.card{box-shadow:var(--shd);transition:transform .3s,box-shadow .3s}
.card:hover{transform:translateY(-6px);box-shadow:0 12px 40px rgba(44,40,38,.16)}
.sec-title::after{content:'';display:block;width:44px;height:2px;background:var(--p);margin-top:12px}
.fa{background:var(--p)!important;color:#fff!important;border-color:var(--p)!important}
</style>
</head>
<body class="antialiased">
<div id="nav-container"></div>

<!-- Page Header -->
<div class="pt-16 bg-hw-bg2 border-b border-hw-border">
  <div class="max-w-7xl mx-auto px-5 py-16">
    <p class="text-xs font-body text-hw-red tracking-widest uppercase mb-3">Portfolio</p>
    <h1 class="font-heading text-4xl lg:text-5xl font-bold text-hw-text mb-4">작품 갤러리</h1>
    <p class="font-body text-hw-muted text-sm max-w-xl">전통 민화의 상징성과 색채미를 담은 작품들을 소개합니다. 각 작품을 클릭하면 상세 정보를 확인하실 수 있습니다.</p>
  </div>
</div>

<!-- Gallery -->
<section class="py-16 bg-hw-bg">
  <div class="max-w-7xl mx-auto px-5">
    <!-- Filter -->
    <div class="flex flex-wrap gap-2 mb-10" id="filter-bar">
      <button onclick="filter('all', this)" class="fa px-5 py-2 text-sm font-body border border-hw-border rounded-sm transition-colors">전체</button>
      <button onclick="filter('전통', this)" class="px-5 py-2 text-sm font-body border border-hw-border rounded-sm hover:bg-hw-red hover:text-white hover:border-hw-red transition-colors text-hw-text">전통민화</button>
      <button onclick="filter('창작', this)" class="px-5 py-2 text-sm font-body border border-hw-border rounded-sm hover:bg-hw-red hover:text-white hover:border-hw-red transition-colors text-hw-text">창작민화</button>
      <button onclick="filter('도예', this)" class="px-5 py-2 text-sm font-body border border-hw-border rounded-sm hover:bg-hw-red hover:text-white hover:border-hw-red transition-colors text-hw-text">도예</button>
    </div>

    <!-- Count -->
    <p id="count" class="font-body text-xs text-hw-muted mb-8"></p>

    <!-- Grid -->
    <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-7"></div>
  </div>
</section>

<div id="footer-container"></div>

<script>
let currentFilter = 'all';

function filter(cat, btn) {
    currentFilter = cat;
    document.querySelectorAll('#filter-bar button').forEach(b => {
        b.classList.remove('fa');
        b.classList.add('text-hw-text');
    });
    btn.classList.add('fa');
    btn.classList.remove('text-hw-text');
    renderGrid();
}

function renderGrid() {
    const filtered = currentFilter === 'all'
        ? artworks
        : artworks.filter(w => w.category === currentFilter);

    document.getElementById('count').textContent = `총 ${filtered.length}점`;
    document.getElementById('grid').innerHTML = filtered.map(w => `
        <a href="artwork.html?id=${w.id}" class="card block bg-white rounded-sm overflow-hidden border border-hw-border hover:border-hw-red transition-colors group">
            <div class="aspect-[3/4] relative bg-hw-bg2 overflow-hidden">
                ${w.image
                    ? `<img src="${w.image}" alt="${w.title}" class="absolute inset-0 w-full h-full object-cover group-hover:scale-105 transition-transform duration-300">`
                    : `<div class="absolute inset-0 flex items-center justify-center"><div class="text-center p-6"><svg class="w-10 h-10 text-hw-red/25 mx-auto mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg><p class="font-heading text-hw-muted text-sm">${w.title}</p></div></div>`
                }
            </div>
            <div class="p-5">
                <div class="flex items-start justify-between mb-1">
                    <div class="font-heading text-lg font-bold text-hw-text">${w.title}</div>
                    <span class="text-xs font-body text-hw-muted bg-hw-bg border border-hw-border px-2 py-0.5 rounded-full flex-shrink-0 ml-2">${w.category}</span>
                </div>
                <div class="font-body text-xs text-hw-muted mb-2">${w.year}${w.size ? ' · ' + w.size : ''}</div>
                <div class="font-body text-xs text-hw-muted leading-relaxed line-clamp-2">${w.meaning}</div>
            </div>
        </a>`).join('');
}

document.addEventListener('DOMContentLoaded', () => {
    initNav('portfolio');
    renderFooter();
    renderGrid();
});
</script>
</body>
</html>
